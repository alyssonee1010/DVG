      - unit: naked_viking
        count: 4
        interval: 1.7
        lane: random

  - time: 40
    type: flag

    spawns:
      - unit: viking
        count: 7
        interval: 1.4
        lane: random

  - time: 56
    type: normal

    spawns:
      - unit: viking
        count: 5
        interval: 1.7
        lane: random
      - unit: naked_viking
        count: 3
        interval: 2.1
        lane: random

  - time: 71
    type: flag

    spawns:
      - unit: naked_viking
        count: 8
        interval: 1.2
        lane: random

  - time: 87
    type: normal

    spawns:
      - unit: viking
